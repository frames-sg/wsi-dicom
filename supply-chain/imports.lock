[[audits.wsi-rs.audits.jxr-native]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "0.1.1 -> 0.2.0"
notes = "Reviewed all changed CPU decoder source: bounded word-at-a-time packet reads, compile-time prefix tables, hoisted output layout/scaling, and SIMD packing/dequantization through safe fearless_simd 1.0 capability tokens. Reads validate packet length before advancing; partial words are padded from bounded slices. Prefix tables have fixed size and compile-time prefix/length checks. Output slices retain geometry validation, SIMD tails use bounded slices, and fused overflow detection returns an error before reconstructed output is accepted. Quantizer steps remain nonzero. No unsafe code or new runtime filesystem, network, subprocess, or environment access was introduced. Existing boundary/parity tests and the independent T.834/T.835 CPU comparison passed 517 in-scope cases, with 179 explicitly out of scope and no failures; this is not a full conformance claim."

