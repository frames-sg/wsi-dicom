[[audits.wsi-rs.audits.jxr-native]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "0.2.1 -> 0.3.0"
notes = "Reviewed all changed decoder source against v0.2.1. The private highpass path writes coefficients directly into the existing adaptive scan; checked coefficient advancement bounds each index and count, and errors discard the partial tile and scan state. The public run/level decoder retains its prior behavior. Other runtime changes are inlining hints, fixed-size slice chunks, and an equivalent bounded integer midpoint. The crate still forbids unsafe code and adds no filesystem, network, subprocess, or environment access. The added differential test covers 4096 complete, malformed, and truncated entropy blocks. This source review does not claim formal verification or complete format conformance."

[[audits.wsi-rs.audits.jxr-native]]
who = "Claude-assisted source review"
criteria = "safe-to-deploy"
delta = "0.3.0 -> 0.3.1"
notes = "Reviewed the exact published 0.3.0 and 0.3.1 package contents; the published source matches VCS commit c296c11 and still forbids unsafe code, with no new dependencies, build script, or runtime filesystem, network, subprocess or environment access. Reviewed the cached entropy bit reader (cache never exceeds the remaining packet bits; reads past the end are zero-filled and bounded), compile-time run-prefix tables, per-tile coefficient windows (split with checked bounds, overruns return errors, and a window must be fully written before it is accepted), four-lane transform and overlap kernels (wrapping fast paths only after a proven magnitude bound, otherwise the checked scalar path), and row-parallel packing behind existing plane validation. Request limits in prepare are unchanged. The release passed the T.834/T.835 CPU comparison on 517 in-scope cases and 15-minute runs of both CPU fuzz targets without failure; this is a source review, not a claim of exhaustive conformance."

[[audits.wsi-rs.audits.sha2-asm]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
version = "0.6.4"
notes = "Reviewed the published MIT package manifest, build.rs, Rust facade, and macOS/aarch64 assembly selected by its build script for this project's target-restricted use. The build script reads Cargo target architecture/vendor and invokes the existing cc dependency on packaged assembly; no runtime filesystem, network or subprocess access is present. The selected assembly reads a fixed 32-byte state and 64-byte input block, uses a bounded 64-byte stack frame, preserves the required callee-saved registers, and writes only the state. wsi-rs does not call this facade directly: enabling sha2 0.10.9's asm feature on macOS/aarch64 selects sha2's own CPU-feature-guarded ARM intrinsics with its software fallback. Independent hash vectors across padding/file boundaries pass in accelerated and forced-software configurations. Other target configurations retain the previous sha2 feature set. This acceptance is for the reviewed integration, not a claim of formal cryptographic verification or testing every assembly target."

[[audits.wsi-rs.audits.zstd]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "0.13.3 -> 0.14.3"
notes = "Reviewed the published delta against the existing 0.13.3 acceptance, focusing on context and dictionary lifetimes, bounded output allocation, reader/writer state, and error handling. Borrowed contexts reset their sessions before reuse; prepared dictionary references now outlive their contexts. Bulk decompression checks the combined frame size against the caller cap, and streaming preallocation is capped. New file-compression helpers read only an explicitly supplied path. No hidden network or subprocess access. The low-level wrapper and bundled C package are accepted separately."

[[audits.wsi-rs.audits.zstd-safe]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "7.2.4 -> 8.2.0"
notes = "Reviewed the published wrapper delta against the existing 7.2.4 acceptance: streaming poison/reset state, dictionary borrows, successful-output commits, capacity checks, seekable offset clamping, callback unwind containment, context cloning, and optional Rust allocator ownership. Failed C operations restore buffer positions before Drop can commit output; write counts are checked against capacity. Unsafe block APIs become explicitly unsafe. Allocator headers use checked size/alignment, handle allocation failure and free(NULL), and are paired on release. No runtime network or subprocess access. This is a source review of the integration, not an independent proof of the Zstandard C implementation."

[[audits.wsi-rs.audits.zstd-sys]]
who = "Codex-assisted source review"
criteria = "safe-to-deploy"
delta = "2.0.16+zstd.1.5.7 -> 2.1.2+zstd.1.5.7"
notes = "Reviewed the published manifest, build script, binding, and wasm-shim delta against the existing acceptance. Bundled C/H codec sources remain Zstandard 1.5.7 and are unchanged. The default build still compiles packaged sources through cc; optional CMake builds only the selected packaged library and contrib sources. No source downloads are introduced. Assembly selection now follows the target architecture, and symbol visibility changes require an explicit build environment override. Wasm allocation now checks multiplication, addition, Layout, NULL allocation and free(NULL); raw-pointer shims become explicitly unsafe. The BSD-3-Clause license is allowed by repository policy."
