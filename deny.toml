# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
# for the full schema.

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
ignore = [
    # RUSTSEC-2021-0153: `encoding` is pulled transitively by dicom-encoding
    # 0.9.1. No safe upstream upgrade exists yet; revisit when dicom-rs
    # replaces it.
    "RUSTSEC-2021-0153",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # Reviewed transitive duplicates currently held by upstream DICOM,
    # wsi-rs compatibility and dev-tool dependencies.
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    # tempfile remains on getrandom 0.3 while the application and current
    # build dependencies use getrandom 0.4.
    { name = "getrandom", version = "0.3.4" },
    { name = "r-efi", version = "5.3.0" },
    # rustix/tempfile use windows-sys 0.52 while clap uses 0.60 and the
    # corresponding windows-targets 0.53 family.
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-targets", version = "0.52.6" },
    { name = "windows_aarch64_gnullvm", version = "0.52.6" },
    { name = "windows_aarch64_msvc", version = "0.52.6" },
    { name = "windows_i686_gnu", version = "0.52.6" },
    { name = "windows_i686_gnullvm", version = "0.52.6" },
    { name = "windows_i686_msvc", version = "0.52.6" },
    { name = "windows_x86_64_gnu", version = "0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "0.52.6" },
    { name = "windows_x86_64_msvc", version = "0.52.6" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
