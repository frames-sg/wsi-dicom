# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
# for the full schema.

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
ignore = [
    # RUSTSEC-2021-0153: `encoding` is pulled transitively by dicom-encoding
    # 0.9.1. No safe upstream upgrade exists yet; revisit when dicom-rs
    # replaces it.
    "RUSTSEC-2021-0153",
    # RUSTSEC-2023-0071: the Marvin timing side channel in `rsa` leaks
    # private-key operations (decryption and signing). Digital Signature
    # validation only verifies with the public key in Certificate of Signer;
    # no private key exists outside the tests that sign their own fixtures.
    # No patched release exists; revisit when one does.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.93

# First-party packages offer AGPLv3 or a separate commercial agreement.
[[licenses.exceptions]]
name = "wsi-dicom"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "wsi-dicom-annotations"
allow = ["AGPL-3.0-only"]

[[licenses.exceptions]]
name = "xtask"
version = "=0.0.0"
allow = ["AGPL-3.0-only"]

# Mozilla's root certificates, as data: the trust anchors of the DICOMweb
# client (ureq with rustls).
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # Reviewed transitive duplicates currently held by upstream DICOM,
    # wsi-rs compatibility and dev-tool dependencies.
    { name = "thiserror", version = "1.0.69" },
    { name = "thiserror-impl", version = "1.0.69" },
    # tempfile remains on getrandom 0.3 while the application and current
    # build dependencies use getrandom 0.4.
    { name = "getrandom", version = "0.3.4" },
    # ring, the rustls provider of the DICOMweb client, remains on getrandom 0.2.
    { name = "getrandom", version = "0.2.17" },
    # wsi-rs remains on base64 0.22 while ureq-proto 0.6, under the DICOMweb
    # client, uses base64 0.23.
    { name = "base64", version = "0.22.1" },
    { name = "r-efi", version = "5.3.0" },
    # rustix/tempfile use windows-sys 0.52 while clap uses 0.60 and the
    # corresponding windows-targets 0.53 family.
    { name = "windows-sys", version = "0.52.0" },
    { name = "windows-targets", version = "0.52.6" },
    { name = "windows_aarch64_gnullvm", version = "0.52.6" },
    { name = "windows_aarch64_msvc", version = "0.52.6" },
    { name = "windows_i686_gnu", version = "0.52.6" },
    { name = "windows_i686_gnullvm", version = "0.52.6" },
    { name = "windows_i686_msvc", version = "0.52.6" },
    { name = "windows_x86_64_gnu", version = "0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "0.52.6" },
    { name = "windows_x86_64_msvc", version = "0.52.6" },
    # J2K 0.13's j2k-core uses windows-sys 0.61 while clap still uses 0.60.
    { name = "windows-sys", version = "0.60.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# First-party J2K and wsi-rs from Cargo.toml [patch.crates-io], and the JXR
# main branch that wsi-rs main names; remove together with that patch once
# they are on crates.io.
allow-git = [
    "https://github.com/frames-sg/j2k",
    "https://github.com/frames-sg/jxr",
    "https://github.com/frames-sg/wsi-rs",
]
