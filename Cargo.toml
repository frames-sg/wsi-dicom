[package]
name = "wsi-dicom"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Convert whole-slide imaging files to DICOM VL Whole Slide Microscopy"
rust-version = "1.99.0"
readme = "README.md"
repository = "https://github.com/frames-sg/wsi-dicom"
homepage = "https://frames-sg.com/dicom-whole-slide-conversion/"
documentation = "https://docs.rs/wsi-dicom"
keywords = ["dicom", "whole-slide", "microscopy", "pathology", "wsi"]
categories = ["multimedia::images", "science"]
exclude = [
    "apps/wsi-dicom-gui/**",
    ".github/**",
    ".cargo/**",
    "fuzz/**",
    "grant/**",
    "docs/**",
    "figure1.pptx",
    "supply-chain/**",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
dicom-core = "0.9"
dicom-dictionary-std = "0.9"
dicom-object = "0.9"
getrandom = "0.4"
moxcms = "0.8.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
j2k-core = "0.12.0"
j2k = "0.12.0"
j2k-cuda = { version = "0.12.0", optional = true, default-features = false, features = ["cuda-runtime"] }
j2k-metal = { version = "0.12.0", optional = true }
j2k-metal-support = { version = "0.12.0", optional = true }
j2k-jpeg = "0.12.0"
j2k-jpeg-metal = { version = "0.12.0", optional = true }
j2k-transcode = "0.12.0"
j2k-transcode-metal = { version = "0.12.0", optional = true }
wsi-rs = "0.8.0"
wsi-dicom-annotations = { version = "=0.1.4", default-features = false }
tempfile = "3"
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true, default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSString"] }
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[features]
default = []
bench-internals = []
cuda = ["dep:j2k-cuda", "wsi-rs/cuda"]
metal = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-metal",
    "dep:j2k-metal",
    "dep:j2k-metal-support",
    "dep:j2k-jpeg-metal",
    "dep:j2k-transcode-metal",
    "wsi-rs/metal",
]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
syn = { version = "2", features = ["full", "visit"] }

[package.metadata.docs.rs]
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "internal_helpers"
harness = false
required-features = ["bench-internals"]

[workspace]
members = [".", "xtask", "apps/wsi-dicom-gui"]
resolver = "2"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "fat"
codegen-units = 1

# J2K and wsi-rs are consumed from their main branches until releases contain
# the JPEG Lossless and optimized-Huffman encoders (J2K) and the NDPI retiling,
# compositing and TIFF LZW changes (wsi-rs 6431c24). Remove this section once
# both are on crates.io; crates.io rejects git dependencies.
[patch.crates-io]
j2k = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-codec-math = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-core = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-cuda = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-cuda-build-support = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-cuda-j2k-engine = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-cuda-runtime = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-jpeg = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-jpeg-metal = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-metal = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-metal-support = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-native = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-profile = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-tilecodec = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-transcode = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-transcode-metal = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
j2k-types = { git = "https://github.com/frames-sg/j2k", rev = "4ca93a56f85634d9cf46c09db2c5955ec77b956b" }
wsi-rs = { git = "https://github.com/frames-sg/wsi-rs", rev = "3f819a3a7d7e724967a5db631bd5d823fc08a517" }
