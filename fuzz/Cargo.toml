[package]
name = "wsi-dicom-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
wsi-rs = "0.8.0"
wsi-dicom = { path = "..", features = ["bench-internals"] }

[workspace]

[[bin]]
name = "metadata_json"
path = "fuzz_targets/metadata_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fhir_bundle"
path = "fuzz_targets/fhir_bundle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tile_preparation"
path = "fuzz_targets/tile_preparation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dicom_validation_fragment"
path = "fuzz_targets/dicom_validation_fragment.rs"
test = false
doc = false
bench = false

# J2K and wsi-rs are consumed from their main branches until releases contain
# the JPEG Lossless and optimized-Huffman encoders (J2K) and the NDPI retiling,
# compositing and TIFF LZW changes (wsi-rs 6431c24). Remove this section once
# both are on crates.io; crates.io rejects git dependencies.
[patch.crates-io]
j2k = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-codec-math = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-core = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-cuda = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-cuda-build-support = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-cuda-j2k-engine = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-cuda-runtime = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-jpeg = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-jpeg-metal = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-metal = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-metal-support = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-native = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-profile = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-tilecodec = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-transcode = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-transcode-metal = { git = "https://github.com/frames-sg/j2k", branch = "main" }
j2k-types = { git = "https://github.com/frames-sg/j2k", branch = "main" }
wsi-rs = { git = "https://github.com/frames-sg/wsi-rs", rev = "97ca1b4656b3cedb2b80738af3bd21ccc1960f0c" }
