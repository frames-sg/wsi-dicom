name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

defaults:
  run:
    working-directory: wsi-dicom

jobs:
  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          curl -sSfL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "${archive_path}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive_path}" | sha256sum --check --strict
          tar -xzf "${archive_path}" -C "${RUNNER_TEMP}" actionlint
          chmod 0755 "${RUNNER_TEMP}/actionlint"
          printf '%s\n' "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: actionlint
      - run: python -m unittest discover -s tests -p 'test_publish_workflow.py'
      - run: python -m unittest discover -s tests -p 'test_release_evidence.py'

  dependency-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: python -m unittest discover -s tests -p 'test_dependency_topology.py'
      - run: cargo package --list

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --no-default-features --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: stable }
          - { os: ubuntu-latest, rust: "1.96" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ matrix.rust }}
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
        if: runner.os == 'Linux'
      - run: cargo test --workspace --no-default-features --all-targets --locked

  external-conformance:
    runs-on: ubuntu-latest
    env:
      WSI_DICOM_REQUIRED_EXTERNAL_TOOLS: dciodvfy,dcentvfy,validate_iods,opj_decompress,djpeg,grk_decompress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install independent DICOM and codec validators
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          dicom3tools grokj2k-tools libjpeg-turbo-progs libopenjp2-tools
      - name: Install the required Python IOD validator
        timeout-minutes: 5
        run: |
          python3 -m venv "${RUNNER_TEMP}/dicom-validator"
          "${RUNNER_TEMP}/dicom-validator/bin/python" -m pip install "dicom-validator==0.8.3" "pydicom==3.0.2"
          echo "${RUNNER_TEMP}/dicom-validator/bin" >> "$GITHUB_PATH"
          # Prepare the standard cache before per-file validation's 15s limit.
          mkdir -p "${RUNNER_TEMP}/empty-dicom"
          "${RUNNER_TEMP}/dicom-validator/bin/validate_iods" --edition 2026c "${RUNNER_TEMP}/empty-dicom"
      - name: Prove every required validator is present
        shell: bash
        run: |
          for tool in dciodvfy dcentvfy validate_iods opj_decompress djpeg grk_decompress; do
            command -v "$tool"
          done
      - name: Run external conformance integration tests
        run: cargo test --package wsi-dicom --locked external_

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo check -p wsi-dicom-gui --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: cargo doc --no-default-features --no-deps --locked

  docs-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: cargo rustdoc --lib --no-default-features --locked -- -D missing_docs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: taiki-e/install-action@91534edaf9fd796a162759d80d49cdff574bff2c
      - run: cargo llvm-cov --package wsi-dicom --lib --bins --tests --no-default-features --locked --summary-only --fail-under-lines 80

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly
      - run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Run bounded seeded fuzz campaigns
        shell: bash
        run: |
          for target in metadata_json fhir_bundle tile_preparation dicom_validation_fragment htj2k_decoder_template; do
            cargo +nightly fuzz run "$target" -- -max_total_time=15 -timeout=5
          done

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@b4a4706ba6e0f8a3cec3ed74eccce6e2d93436f7
      - run: scripts/check-semver.sh

  features:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, feature: cuda }
          - { os: macos-latest, feature: metal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: cargo check --features cuda --lib --locked
        if: matrix.feature == 'cuda'
      - run: cargo check --features metal --lib --locked
        if: matrix.feature == 'metal'

  metal-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: cargo test --workspace --features metal --all-targets --locked

  bench-internals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: cargo check --features bench-internals --benches --locked

  metal-feature:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - run: cargo check --features metal --lib --locked

  python-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Fetch locked dependencies for offline package inspection
        run: cargo fetch --locked
      - run: python -m venv .venv-bench
      - run: .venv-bench/bin/python -m pip install --upgrade pip
      - run: .venv-bench/bin/python -m pip install -r bench/requirements.txt
      - run: .venv-bench/bin/python -m unittest discover -s tests -v

  controlled-failure-benchmark:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frames-sg/wsi-dicom-bench
          ref: caafcd9bc660fa86a7fc6db09a08bd8538181400
          path: wsi-dicom-bench
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install independent DICOM and codec validators
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          dicom3tools grokj2k-tools libjpeg-turbo-progs libopenjp2-tools
      - name: Install the pinned benchmark and Python IOD validator
        run: |
          python -m venv "${RUNNER_TEMP}/wsi-dicom-bench"
          mkdir -p "${RUNNER_TEMP}/benchmark-wheel"
          "${RUNNER_TEMP}/wsi-dicom-bench/bin/python" -m pip wheel ../wsi-dicom-bench --wheel-dir "${RUNNER_TEMP}/benchmark-wheel"
          "${RUNNER_TEMP}/wsi-dicom-bench/bin/python" -m pip install "${RUNNER_TEMP}"/benchmark-wheel/wsi_dicom_bench-*.whl "dicom-validator==0.8.3"
          echo "${RUNNER_TEMP}/wsi-dicom-bench/bin" >> "${GITHUB_PATH}"
          mkdir -p "${RUNNER_TEMP}/empty-dicom"
          "${RUNNER_TEMP}/wsi-dicom-bench/bin/validate_iods" --edition 2026c "${RUNNER_TEMP}/empty-dicom"
      - name: Run the complete locked challenge against this source revision
        env:
          WSI_DICOM_BENCH: ${{ runner.temp }}/wsi-dicom-bench/bin/wsi-dicom-bench
        run: |
          suite="$("${RUNNER_TEMP}/wsi-dicom-bench/bin/python" -c 'from importlib.resources import files; print(files("wsi_dicom_bench").joinpath("negative_bench/manifest-v4.json"))')"
          cargo xtask benchmark --suite "${suite}" --output "${RUNNER_TEMP}/controlled-failure-evidence"
          candidate_sha256="$(sha256sum target/release/wsi-dicom | cut -d ' ' -f 1)"
          recorded_sha256="$("${RUNNER_TEMP}/wsi-dicom-bench/bin/python" -c 'import json, os; from pathlib import Path; report=json.loads((Path(os.environ["RUNNER_TEMP"]) / "controlled-failure-evidence/observed-results/run-summary.json").read_text()); print(report["environment"]["wsi_dicom_sha256"])')"
          test "${recorded_sha256}" = "${candidate_sha256}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: controlled-failure-evidence
          path: ${{ runner.temp }}/controlled-failure-evidence
          if-no-files-found: warn

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: crate-ci/typos@d80b8e26878e372a041833cd67163dbdb6a4336e
        with:
          files: wsi-dicom
          config: wsi-dicom/.github/typos.toml

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wsi-dicom
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87
        with:
          command: check
          arguments: ""
          command-arguments: advisories bans licenses sources
          manifest-path: ./wsi-dicom/Cargo.toml
      - run: cargo install cargo-audit --locked --version 0.22.1
      - run: cargo audit --file Cargo.lock --ignore RUSTSEC-2021-0153 --ignore RUSTSEC-2024-0436
      - run: cargo install cargo-vet --locked --version 0.10.2
      - run: cargo vet --locked
