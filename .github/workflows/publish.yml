name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  rehearsal:
    name: Credential-free release rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Verify package without registry credentials
        run: scripts/publish-crate.sh --dry-run

  verify_release:
    name: Verify tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Validate tag, changelog, and protected branch ancestry
        id: release
        shell: bash
        run: |
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c '
          import json
          import sys

          packages = [
              package
              for package in json.load(sys.stdin)["packages"]
              if package["name"] == "wsi-dicom"
          ]
          if len(packages) != 1:
              raise SystemExit(f"expected one wsi-dicom package, found {len(packages)}")
          print(packages[0]["version"])
          '
          )"
          expected_tag="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "release tag must be ${expected_tag}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          PACKAGE_VERSION="$version" python3 - <<'PY'
          import datetime
          import os
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          prefix = f"## [{version}] - "
          headings = [
              line
              for line in Path(".github/CHANGELOG.md").read_text(encoding="utf-8").splitlines()
              if line.startswith(f"## [{version}]")
          ]
          if len(headings) != 1 or not headings[0].startswith(prefix):
              raise SystemExit(f"expected one dated changelog heading for {version}")
          release_date = datetime.date.fromisoformat(headings[0][len(prefix):])
          if headings[0] != f"{prefix}{release_date.isoformat()}":
              raise SystemExit(f"invalid changelog heading for {version}")
          PY
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release commit is not on origin/main" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh run list \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --limit 100 \
            --json headSha,status,conclusion |
            jq -e --arg sha "$GITHUB_SHA" \
              'any(.[]; .headSha == $sha and .status == "completed" and .conclusion == "success")' \
              >/dev/null
          then
            echo "no successful CI run found for ${GITHUB_SHA}" >&2
            exit 1
          fi
      - name: Verify the exact package without credentials
        run: scripts/publish-crate.sh --dry-run

  build_cli_archives:
    name: CPU CLI ${{ matrix.target }}
    needs:
      - rehearsal
      - verify_release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && needs.rehearsal.result == 'success') ||
      (github.event_name == 'push' && github.ref_type == 'tag' && needs.verify_release.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, archive: tar }
          - { os: macos-15-intel, target: x86_64-apple-darwin, archive: tar }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}
      - name: Build CPU-only CLI
        run: cargo build --release --locked --no-default-features --target ${{ matrix.target }}
      - name: Package Unix CLI archive
        if: matrix.archive == 'tar'
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wsi-dicom"))')"
          binary="target/${RELEASE_TARGET}/release/wsi-dicom"
          if [[ "$($binary --version)" != "wsi-dicom ${version}" ]]; then
            echo "built CLI version does not match ${version}" >&2
            exit 1
          fi
          artifact="wsi-dicom-${version}-${RELEASE_TARGET}.tar.gz"
          stage="dist/wsi-dicom-${version}-${RELEASE_TARGET}"
          mkdir -p "$stage"
          cp "$binary" "$stage/wsi-dicom"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          lock_sha="$(shasum -a 256 Cargo.lock | awk '{print $1}')"
          scripts/write-release-metadata.py \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --target "$RELEASE_TARGET" \
            --artifact "$artifact" \
            --rustc "$(rustc --version)" \
            --cargo "$(cargo --version)" \
            --lock-sha256 "$lock_sha" \
            --output "dist/${artifact}.metadata.json"
          cp "dist/${artifact}.metadata.json" "$stage/VERSION.json"
          tar --create --gzip --file "dist/${artifact}" --directory dist "$(basename "$stage")"
      - name: Package Windows CLI archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "wsi-dicom" }).version
          $binary = "target/$env:RELEASE_TARGET/release/wsi-dicom.exe"
          if ((& $binary --version) -ne "wsi-dicom $version") {
            throw "built CLI version does not match $version"
          }
          $artifact = "wsi-dicom-$version-$env:RELEASE_TARGET.zip"
          $stage = "dist/wsi-dicom-$version-$env:RELEASE_TARGET"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $binary "$stage/wsi-dicom.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          $lockSha = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/write-release-metadata.py `
            --version $version `
            --commit $env:GITHUB_SHA `
            --target $env:RELEASE_TARGET `
            --artifact $artifact `
            --rustc (rustc --version) `
            --cargo (cargo --version) `
            --lock-sha256 $lockSha `
            --output "dist/$artifact.metadata.json"
          Copy-Item "dist/$artifact.metadata.json" "$stage/VERSION.json"
          Compress-Archive -Path $stage -DestinationPath "dist/$artifact"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.metadata.json
          if-no-files-found: error
          retention-days: 14

  crate_candidate:
    name: Crate candidate and independent validation
    needs:
      - rehearsal
      - verify_release
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && needs.rehearsal.result == 'success') ||
      (github.event_name == 'push' && github.ref_type == 'tag' && needs.verify_release.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      WSI_DICOM_REQUIRED_EXTERNAL_TOOLS: dciodvfy,dcentvfy,validate_iods,opj_decompress,djpeg,grk_decompress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install independent DICOM and codec validators
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          dicom3tools grokj2k-tools libjpeg-turbo-progs libopenjp2-tools
      - name: Install the required Python IOD validator
        timeout-minutes: 5
        run: |
          python3 -m venv "${RUNNER_TEMP}/dicom-validator"
          "${RUNNER_TEMP}/dicom-validator/bin/python" -m pip install "dicom-validator==0.8.3" "pydicom==3.0.2"
          echo "${RUNNER_TEMP}/dicom-validator/bin" >> "$GITHUB_PATH"
          # Prepare the standard cache before per-file validation's 15s limit.
          mkdir -p "${RUNNER_TEMP}/empty-dicom"
          "${RUNNER_TEMP}/dicom-validator/bin/validate_iods" --edition 2026c "${RUNNER_TEMP}/empty-dicom"
      - name: Build and test the exact crate package
        shell: bash
        run: |
          cargo package --locked
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wsi-dicom"))')"
          cargo test \
            --manifest-path "target/package/wsi-dicom-${version}/Cargo.toml" \
            --no-default-features \
            --locked
          mkdir -p dist/validation
          artifact="wsi-dicom-${version}.crate"
          cp "target/package/${artifact}" "dist/${artifact}"
          lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          scripts/write-release-metadata.py \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --target source-crate \
            --artifact "$artifact" \
            --rustc "$(rustc --version)" \
            --cargo "$(cargo --version)" \
            --lock-sha256 "$lock_sha" \
            --output "dist/${artifact}.metadata.json"
      - name: Run strict doctor and synthetic end-to-end validation
        shell: bash
        run: |
          cargo build --release --locked --no-default-features --bin wsi-dicom
          if ! target/release/wsi-dicom doctor --strict --json > dist/validation/doctor.json
          then
            cat dist/validation/doctor.json
            exit 1
          fi
          if ! target/release/wsi-dicom self-test \
              --strict \
              --json \
              --out self-test-evidence \
              --keep-output > dist/validation/self-test.json
          then
            cat dist/validation/self-test.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          packages = subprocess.check_output(
              [
                  "dpkg-query",
                  "-W",
                  "-f=${Package}=${Version}\\n",
                  "dicom3tools",
                  "grokj2k-tools",
                  "libjpeg-turbo-progs",
                  "libopenjp2-tools",
              ],
              text=True,
          ).splitlines()
          tools = {
              name: shutil.which(name)
              for name in ("dciodvfy", "dcentvfy", "validate_iods", "opj_decompress", "djpeg", "grk_decompress")
          }
          document = {
              "packages": packages,
              "python_packages": subprocess.check_output(
                  ["python3", "-m", "pip", "freeze"], text=True
              ).splitlines(),
              "tools": tools,
              "wsi_dicom": subprocess.check_output(
                  ["target/release/wsi-dicom", "--version"], text=True
              ).strip(),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
          }
          Path("dist/validation/versions.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crate-candidate
          path: |
            dist/*.crate
            dist/*.metadata.json
            dist/validation/*.json
          if-no-files-found: error
          retention-days: 14

  release_evidence:
    name: Checksums, SPDX SBOMs, and release evidence
    needs:
      - build_cli_archives
      - crate_candidate
    if: always() && needs.build_cli_archives.result == 'success' && needs.crate_candidate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      SYFT_VERSION: 1.50.0
      SYFT_ARCHIVE_SHA256: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          path: candidate
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crate-candidate
          path: candidate
      - name: Install checksum-verified Syft
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$SYFT_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/syft"
          tar --extract --gzip --file "$archive" --directory "${RUNNER_TEMP}/syft" syft
          "${RUNNER_TEMP}/syft/syft" version
      - name: Generate one SPDX JSON SBOM per release artifact
        shell: bash
        run: |
          for metadata in candidate/*.metadata.json; do
            artifact="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["artifact"])' "$metadata")"
            "${RUNNER_TEMP}/syft/syft" scan "file:candidate/${artifact}" \
              --output "spdx-json=candidate/${artifact}.spdx.json"
          done
      - name: Build checksums and release-evidence manifest
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wsi-dicom"))')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            approval_state="candidate_pending_explicit_release_approval"
          else
            approval_state="rehearsal_not_approved_for_release"
          fi
          scripts/build-release-evidence.py \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --artifacts candidate \
            --lockfile Cargo.lock \
            --validators candidate/validation \
            --workflow-identity "${GITHUB_WORKFLOW}@${GITHUB_WORKFLOW_REF}#${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --approval-state "$approval_state" \
            --syft-version "$SYFT_VERSION" \
            --syft-archive-sha256 "$SYFT_ARCHIVE_SHA256" \
            --output candidate/release-evidence.json
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("candidate")
          files = sorted(path for path in root.rglob("*") if path.is_file() and path.name != "SHA256SUMS")
          with (root / "SHA256SUMS").open("w", encoding="utf-8", newline="\n") as output:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  output.write(f"{digest}  {path.relative_to(root).as_posix()}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Sigstore attest ${{ matrix.label }}
    needs: release_evidence
    if: always() && needs.release_evidence.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, pattern: "wsi-dicom-*-x86_64-unknown-linux-gnu.tar.gz" }
          - { label: macos-x86_64, pattern: "wsi-dicom-*-x86_64-apple-darwin.tar.gz" }
          - { label: macos-arm64, pattern: "wsi-dicom-*-aarch64-apple-darwin.tar.gz" }
          - { label: windows-x86_64, pattern: "wsi-dicom-*-x86_64-pc-windows-msvc.zip" }
          - { label: crate, pattern: "wsi-dicom-*.crate" }
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Resolve one artifact and its SBOM
        id: artifact
        shell: bash
        env:
          SUBJECT_PATTERN: ${{ matrix.pattern }}
        run: |
          mapfile -d '' -t matches < <(
            find candidate -maxdepth 1 -type f -name "$SUBJECT_PATTERN" -print0
          )
          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "expected one subject for ${SUBJECT_PATTERN}, found ${#matches[@]}" >&2
            exit 1
          fi
          subject="${matches[0]}"
          sbom="${subject}.spdx.json"
          test -f "$sbom"
          printf 'subject=%s\n' "$subject" >> "$GITHUB_OUTPUT"
          printf 'sbom=%s\n' "$sbom" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.subject }}
      - name: Attest SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.subject }}
          sbom-path: ${{ steps.artifact.outputs.sbom }}

  registry_status:
    name: Check public crates.io version state
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify_release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      state: ${{ steps.registry.outputs.state }}
    steps:
      - name: Query public registry before authentication
        id: registry
        env:
          PACKAGE_VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          if ! status="$(
            curl --silent --show-error --location \
              --user-agent "wsi-dicom-release-workflow/${PACKAGE_VERSION} (+https://github.com/frames-sg/wsi-dicom)" \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/wsi-dicom/${PACKAGE_VERSION}"
          )"
          then
            echo "failed to query crates.io" >&2
            exit 1
          fi
          case "$status" in
            200) printf 'state=published\n' >> "$GITHUB_OUTPUT" ;;
            404) printf 'state=unpublished\n' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "crates.io version query returned HTTP ${status}" >&2
              exit 1
              ;;
          esac

  publish:
    name: Publish verified crate
    if: >-
      always() &&
      needs.verify_release.result == 'success' &&
      needs.registry_status.result == 'success' &&
      needs.release_evidence.result == 'success' &&
      needs.attest.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.registry_status.outputs.state == 'unpublished'
    needs:
      - verify_release
      - registry_status
      - release_evidence
      - attest
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Reproduce the attested crate candidate before authentication
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo package --locked --no-verify
          candidate="${RUNNER_TEMP}/candidate/wsi-dicom-${version}.crate"
          printf '%s  %s\n' \
            "$(sha256sum "$candidate" | awk '{print $1}')" \
            "target/package/wsi-dicom-${version}.crate" |
            sha256sum --check --strict
      - name: Request short-lived crates.io credential
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish the already-verified package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: scripts/publish-crate.sh --publish

  verify_registry_checksum:
    name: Verify published registry checksum
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.attest.result == 'success' &&
      (needs.publish.result == 'success' ||
      (needs.publish.result == 'skipped' && needs.registry_status.outputs.state == 'published'))
    needs:
      - registry_status
      - publish
      - release_evidence
      - attest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Match crates.io to the attested candidate
        run: >-
          scripts/verify-registry-checksum.py
          --candidate "candidate/wsi-dicom-${GITHUB_REF_NAME#v}.crate"
          --version "${GITHUB_REF_NAME#v}"

  draft_release:
    name: Create controlled draft GitHub Release
    if: >-
      always() &&
      needs.verify_registry_checksum.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag'
    needs: verify_registry_checksum
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Extract controlled release notes
        run: >-
          scripts/extract-release-notes.py
          --changelog .github/CHANGELOG.md
          --version "${GITHUB_REF_NAME#v}"
          > "${RUNNER_TEMP}/release-notes.md"
      - name: Create or update draft release only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find candidate -type f -print0 | sort -z)
          if state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$state" != "true" ]]; then
              echo "refusing to modify a non-draft GitHub Release" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file "${RUNNER_TEMP}/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --draft \
              --verify-tag \
              --title "wsi-dicom ${GITHUB_REF_NAME#v}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
